<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Depths</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Depths">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1118">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=0.11">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=0.11">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="icon-180.png?v=0.11">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#0f1118; --panel:#1b1f2b; --line:#33394a; --text:#e9e4d6; --muted:#9aa3b2; --gold:#d4a843; --ink:#151821; --warn:#e0874f;
  --head:"Segoe UI",system-ui,sans-serif; --body:"Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--body);display:flex;flex-direction:column;align-items:center}
h1{font:700 20px var(--head);margin:0}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:600}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{width:100%;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;padding:12px 18px}
.muted{color:var(--muted);font-size:14px}
#load{max-width:540px;margin:40px 16px;text-align:center;background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:30px 22px}
#load.over{border-color:var(--gold)}
#load h2{font:700 22px var(--head);margin:0 0 6px}
#msg{margin-top:12px;white-space:pre-line;font-size:14px}
#msg.err{color:var(--warn)}
#stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 12px 16px;width:100%}
#screen{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border-radius:4px;display:block;max-width:100%}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:14px;color:var(--muted);max-width:900px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
kbd{font:12px var(--body);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);color:var(--text)}
[hidden]{display:none !important}
body.touch{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.touch .keys,body.touch header{display:none}
#touch{position:fixed;inset:0;pointer-events:none;z-index:5}
#touch[hidden]{display:none !important}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);color:rgba(255,255,255,.85);font:700 14px var(--head);display:flex;align-items:center;justify-content:center;touch-action:none}
.tb.on{background:rgba(212,168,67,.55)}
.sq{border-radius:14px}
#tL{left:max(12px,env(safe-area-inset-left));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 40px);width:64px;height:64px}
#tR{left:calc(max(12px,env(safe-area-inset-left)) + 76px);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 40px);width:64px;height:64px}
#tU{left:calc(max(12px,env(safe-area-inset-left)) + 38px);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 100px);width:64px;height:64px}
#tD{left:calc(max(12px,env(safe-area-inset-left)) + 38px);bottom:max(14px,env(safe-area-inset-bottom));width:64px;height:48px}
#tJ{right:calc(max(14px,env(safe-area-inset-right)) + 86px);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 24px);width:76px;height:76px}
#tA{right:max(14px,env(safe-area-inset-right));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 70px);width:76px;height:76px}
#tM{right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:48px;height:48px;font-size:12px}
</style>
</head>
<body>

<header>
  <h1>The Depths</h1>
  <span class="muted" id="status">Tap Jump to begin.</span>
</header>


<div id="touch" hidden>
  <div class="tb" id="tL" data-k="left">&#9664;</div><div class="tb" id="tR" data-k="right">&#9654;</div>
  <div class="tb" id="tU" data-k="up">&#9650;</div><div class="tb" id="tD" data-k="down">&#9660;</div>
  <div class="tb" id="tJ" data-k="jump">JUMP</div><div class="tb" id="tA" data-k="attack">FLAIL</div>
  <div class="tb sq" id="tM" data-k="map">MAP</div>
</div>

<div id="stage" hidden>
  <canvas id="screen" width="256" height="224" tabindex="0" aria-label="Game screen"></canvas>
  <div class="keys">
    <span><kbd>←</kbd> <kbd>→</kbd> walk</span>
    <span><kbd>↑</kbd> <kbd>↓</kbd> climb chains</span>
    <span><kbd>↓</kbd> crouch, <kbd>↓</kbd>+<kbd>Z</kbd> drop through a ledge</span>
    <span><kbd>Z</kbd>/<kbd>Space</kbd> jump</span>
    <span><kbd>X</kbd> flail</span>
    <span><kbd>↑</kbd> at a caged wise man: shop</span>
    <span><kbd>M</kbd> map</span>
    <span><kbd>`</kbd> debug view</span>
  </div>
  <div class="row">
    <span class="muted" id="seedLbl"></span>
    <button id="newWorld">New world</button>
  </div>
</div>

<script>
const VERSION = "0.11";   // revision number: bump on every push
"use strict";
/* ======================================================================
   1. CONFIG — tune the feel of the game here
   ====================================================================== */
const CFG = {
  walkSpeed: 1.25, jumpSpeed: 5.3, gravity: 0.25, maxFall: 5, shortHop: 2,
  climbSpeed: 1, maxHP: 6, invulnFrames: 60,
  attackLength: 26, strikeFrom: 9, strikeTo: 20,
  saveEvery: 600,              // frames between autosaves
  coyote: 6, jumpBuffer: 6,    // frames of forgiveness for jumping
  grabRange: 4,                // px of slack when grabbing a chain
  hitPause: 3, shakeHit: 10, shakeKill: 5,   // frames
};
// World size, in cells. One cell = one screen = 16 x 14 tiles = 256 x 224 px.
const CW = 16, CH = 14, GW = 36, GH = 24, TS = 16;
const WT = GW * CW, HT = GH * CH;   // world size in tiles

/* Zones run from the surface down. "lab" zones are tight labyrinths.
   lv/p choose which level palette the ROM art uses for the zone's tiles. */
const ZONES = [
  { name: "Upper Halls", enemies: [["crawler",6],["bat",2]],        lv: 0, p: 2,  lab: false, loop: 0.08, wall: "#4a4a5e", solid: "#b07040", ledge: "#c8a050" },
  { name: "Mossy Galleries", enemies: [["crawler",4],["bat",3],["skeleton",2]],    lv: 4, p: 14, lab: false, loop: 0.12, wall: "#2f4a35", solid: "#8a9a50", ledge: "#b8c070" },
  { name: "Sandstone Labyrinth", enemies: [["crawler",3],["skeleton",3],["dropper",2]],lv: 2, p: 9,  lab: true,  loop: 0.35, wall: "#5e4630", solid: "#d09060", ledge: "#e8b070" },
  { name: "Flooded Vaults", enemies: [["bat",3],["skeleton",3],["knight",1],["crawler",2]],     lv: 1, p: 6,  lab: false, loop: 0.10, wall: "#283a5e", solid: "#5080c0", ledge: "#4a9a8a" },
  { name: "Iron Mines", enemies: [["skeleton",3],["knight",3],["dropper",2],["bat",2]],         lv: 6, p: 15, lab: false, loop: 0.10, wall: "#3a3a3a", solid: "#808080", ledge: "#d08040" },
  { name: "Crystal Depths", enemies: [["bat",3],["dropper",3],["knight",2],["skeleton",2]],     lv: 7, p: 6,  lab: true,  loop: 0.30, wall: "#4a4020", solid: "#c0a040", ledge: "#5070e0" },
  { name: "Magma Roots", enemies: [["knight",4],["skeleton",3],["bat",3],["dropper",2]],        lv: 3, p: 10, lab: false, loop: 0.12, wall: "#4a2018", solid: "#c04020", ledge: "#f08030" },
  { name: "Ancient Core", enemies: [["knight",4],["skeleton",3],["dropper",3],["bat",3]],       lv: 5, p: 7,  lab: true,  loop: 0.25, wall: "#40403a", solid: "#e0d0a0", ledge: "#40a0a0" },
];
/* Enemy types. w/h in px, speed in px per frame. hp grows by 1 every 3 zones deep.
   Behaviour for each type is in BEHAVE (section 10). */
const ENEMIES = {
  crawler:  { w: 16, h: 16, hp: 1, speed: 0.5,  drop: ["coin10", 10] },
  bat:      { w: 16, h: 12, hp: 1, speed: 1.15, drop: ["coin10", 10], sight: 110, swoopFrames: 70 },
  skeleton: { w: 16, h: 32, hp: 2, speed: 0.35, drop: ["coin10", 10], sight: 128, throwEvery: 100 },
  knight:   { w: 16, h: 32, hp: 3, speed: 0.3,  drop: ["coin50", 50], sight: 110, block: true, turnFrames: 45, dmg: 2 },
  dropper:  { w: 16, h: 16, hp: 1, speed: 0.8,  drop: ["coin10", 10], fallAccel: 0.25, restFrames: 70, dmg: 2 },
};
/* Progression. Armour adds life and cuts damage from big hits; the flail gains damage and reach.
   col is the placeholder hero's armour colour. ROM-art armour sets are chosen in the owner's workshop. */
const ARMOUR = [
  { hp: 0, red: 0, col: "#a8662a" }, { hp: 2, red: 0, col: "#7a8a52" }, { hp: 3, red: 1, col: "#4a78c8" },
  { hp: 4, red: 1, col: "#6a3a8a" }, { hp: 6, red: 2, col: "#c8c8d8" },
];
const FLAIL = [null, { dmg: 1, reach: 0 }, { dmg: 2, reach: 8 }, { dmg: 3, reach: 16 }];
const PRICES = { potion: 100, key: 150, flail: [0, 0, 400, 900], armour: [300, 700, 1500, 3000] };   // armour[i] = price to go from level i to i+1
const zoneOfCellY = cy => Math.min(ZONES.length - 1, Math.floor(cy / 3));

// Tile codes in the world grid
const EMPTY = 0, SOLID = 1, LEDGE = 2, CHAIN = 3, LEDGECHAIN = 4, LOCK = 5;   // LOCK: a locked door, opened with a key

/* ======================================================================
   2. HELPERS
   ====================================================================== */
const $ = id => document.getElementById(id);
// Sound hook: called from jump, land, hit, hurt, coin, jar, potion and shrine. Silent until the audio phase.
function sfx(name) {}

/* ======================================================================
   3. ART — one interface, two backends.
   "rom" draws pieces decoded from the player's files at runtime.
   "placeholder" draws simple original shapes, so the game runs without files.
   Game code only calls Art.*; it never touches ROM data directly.
   ====================================================================== */
const Art = {
  mode: "placeholder",
  cache: new Map(),
  // ---- layout data: piece numbers only, no graphics ----
  // A finished 16x16 map tile. kind: wall | fill | surf | ledge | under | chain | ledgechain
  tile(zone, kind, x, y) {
    const key = "t" + this.mode + zone + kind + ((x % 8) + 8) % 8 + "," + ((y % 8) + 8) % 8; if (this.cache.has(key)) return this.cache.get(key);
    const c = mk(16, 16), g = c.getContext("2d"), Z = ZONES[zone];
    const chainOver = () => { g.save(); g.translate(8, 8); g.rotate(Math.PI / 2); g.drawImage(phChain(), -8, -8); g.restore(); };
    phTile(g, Z, kind, ((x % 8) + 8) % 8, ((y % 8) + 8) % 8, zone);
    if (kind === "chain" || kind === "ledgechain") chainOver();
    this.cache.set(key, c); return c;
  },
  // Hero frame: returns { img, ox } where ox is the hero's x=0 inside img
  hero(name, dir) {
    const key = "h" + this.mode + name + dir + (this.mode === "rom" ? "" : (G ? G.armour : 0)); if (this.cache.has(key)) return this.cache.get(key);
    const minX = name.includes("strike") ? -32 : 0, HH = 48, c = mk(32 - minX, HH), g = c.getContext("2d");   // strike frames are 64 wide so the chain has room
    phHero(g, name, -minX);
    let out = { img: c, ox: -minX, oy: HH - 32 };
    if (dir > 0) { const m = mk(c.width, HH), mg = m.getContext("2d"); mg.translate(c.width, 0); mg.scale(-1, 1); mg.drawImage(c, 0, 0); out = { img: m, ox: c.width - (-minX + 32), oy: HH - 32 }; }
    this.cache.set(key, out); return out;
  },
  item(name) {
    const key = "i" + this.mode + name; if (this.cache.has(key)) return this.cache.get(key);
    const c = phItem(name);
    this.cache.set(key, c); return c;
  },
};
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };

// ---- placeholder drawings (original, simple) ----
function phChain() { const c = mk(16, 16), g = c.getContext("2d"); g.fillStyle = "#aab"; for (let x = 0; x < 16; x += 5) g.fillRect(x, 6, 4, 3); g.fillStyle = "#667"; for (let x = 4; x < 16; x += 5) g.fillRect(x, 7, 1, 1); return c; }
function phItem(name) {
  const c = mk(16, 16), g = c.getContext("2d");
  if (name.startsWith("coin") || name === "hudCoin") { g.fillStyle = "#b07010"; g.beginPath(); g.arc(8, 8, 6, 0, 7); g.fill(); g.fillStyle = "#ffd040"; g.beginPath(); g.arc(8, 8, 4.5, 0, 7); g.fill(); g.fillStyle = "#b07010"; g.fillRect(7, 5, 2, 6); }
  else if (name === "jar") { g.fillStyle = "#a05020"; g.fillRect(4, 5, 8, 10); g.fillRect(6, 2, 4, 3); g.fillStyle = "#d08040"; g.fillRect(5, 6, 2, 7); }
  else if (name === "potion") { g.fillStyle = "#c02040"; g.fillRect(4, 7, 8, 8); g.fillStyle = "#ddd"; g.fillRect(6, 3, 4, 4); }
  else { g.fillStyle = name === "shrineA" ? "#ffe060" : "#ffa020"; g.beginPath(); for (let k = 0; k < 10; k++) { const r = k % 2 ? 3 : 7, a = k * Math.PI / 5; g.lineTo(8 + Math.cos(a) * r, 8 + Math.sin(a) * r); } g.fill(); }
  return c;
}
/* ---- curved, shaded pixel-art toolkit (original art) ----
   Shapes are ellipses, tapered capsules (limbs) and polygons. Each is inked with a dark outline and
   shaded as a rounded form (highlight, base, shadow, rim) with the light from the top left. */
const OUTL = "#1a1230";   // dark indigo, never pure black
let inkFlash = false;
function shadeCol(c, f) { const n = parseInt(c.slice(1), 16); return "rgb(" + Math.min(255, Math.round((n >> 16) * f)) + "," + Math.min(255, Math.round(((n >> 8) & 255) * f)) + "," + Math.min(255, Math.round((n & 255) * f)) + ")"; }
const tri = c => [c, shadeCol(c, 1.5), shadeCol(c, 0.62), shadeCol(c, 0.38)];   // base, highlight, shadow, rim
const Sh = {
  ell(cx, cy, rx, ry) { return { bb: [cx - rx, cy - ry, cx + rx, cy + ry], test: (x, y) => { const a = (x + .5 - cx) / rx, b = (y + .5 - cy) / ry; return a * a + b * b <= 1; }, norm: (x, y) => [(x + .5 - cx) / rx, (y + .5 - cy) / ry] }; },
  sq(cx, cy, rx, ry, n) { n = n || 4; return { bb: [cx - rx, cy - ry, cx + rx, cy + ry], test: (x, y) => Math.pow(Math.abs((x + .5 - cx) / rx), n) + Math.pow(Math.abs((y + .5 - cy) / ry), n) <= 1, norm: (x, y) => [(x + .5 - cx) / rx, (y + .5 - cy) / ry] }; },
  cap(x0, y0, x1, y1, r0, r1) {
    if (r1 === undefined) r1 = r0; const dx = x1 - x0, dy = y1 - y0, L = dx * dx + dy * dy || 1, R = Math.max(r0, r1);
    const q = (x, y) => { let t = ((x + .5 - x0) * dx + (y + .5 - y0) * dy) / L; t = t < 0 ? 0 : t > 1 ? 1 : t; return [x + .5 - (x0 + dx * t), y + .5 - (y0 + dy * t), r0 + (r1 - r0) * t]; };
    return { bb: [Math.min(x0, x1) - R, Math.min(y0, y1) - R, Math.max(x0, x1) + R, Math.max(y0, y1) + R], test: (x, y) => { const [a, b, r] = q(x, y); return a * a + b * b <= r * r; }, norm: (x, y) => { const [a, b, r] = q(x, y); return [a / r, b / r]; } };
  },
  poly(pts) {
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), n = pts.length;
    return { bb: [x0, y0, x1, y1], test: (x, y) => { const px = x + .5, py = y + .5; let c = false; for (let i = 0, j = n - 1; i < n; j = i++) { const a = pts[i], b = pts[j]; if ((a[1] > py) !== (b[1] > py) && px < (b[0] - a[0]) * (py - a[1]) / (b[1] - a[1]) + a[0]) c = !c; } return c; }, norm: (x, y) => [(x + .5 - (x0 + x1) / 2) / ((x1 - x0) / 2 || 1) * .7, (y + .5 - (y0 + y1) / 2) / ((y1 - y0) / 2 || 1) * .7] };
  },
};
function inkPart(g, sh, t, noOutline) {
  const x0 = Math.floor(sh.bb[0]) - 1, y0 = Math.floor(sh.bb[1]) - 1, x1 = Math.ceil(sh.bb[2]) + 1, y1 = Math.ceil(sh.bb[3]) + 1, ins = sh.test;
  const lit = (x, y) => { const n = sh.norm(x, y); return -(n[0] * 0.6 + n[1] * 0.8); };
  if (!noOutline) {
    g.fillStyle = OUTL;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (!ins(x, y)) {
      let nb = null; if (ins(x - 1, y)) nb = [x - 1, y]; else if (ins(x + 1, y)) nb = [x + 1, y]; else if (ins(x, y - 1)) nb = [x, y - 1]; else if (ins(x, y + 1)) nb = [x, y + 1];
      if (!nb) continue;
      if (lit(nb[0], nb[1]) > 0.8 && ((x + y) & 1)) continue;          // the outline breaks where light hits directly
      g.fillRect(x, y, 1, 1);
    }
  }
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (ins(x, y)) {
    const l = lit(x, y) + ((((x >> 1) + (y >> 1)) & 1) ? 0.13 : -0.13);                 // checkerboard dither between neighbouring tones
    g.fillStyle = inkFlash ? "#fff" : l > 0.55 ? t[1] : l > -0.2 ? t[0] : l > -0.68 ? t[2] : t[3]; g.fillRect(x, y, 1, 1);
  }
}
// hand-placed pixels: each char maps to a colour, '.' is transparent
function stamp(g, x, y, rows, pal, fx, fy) { const H = rows.length; for (let j = 0; j < H; j++) { const row = rows[fy ? H - 1 - j : j], W2 = row.length; for (let i = 0; i < W2; i++) { const c = pal[row[fx ? W2 - 1 - i : i]]; if (c) { g.fillStyle = inkFlash ? "#fff" : c; g.fillRect(x + i, y + j, 1, 1); } } } }
function bez(x0, y0, cx, cy, x1, y1, t) { const u = 1 - t; return [u * u * x0 + 2 * u * t * cx + t * t * x1, u * u * y0 + 2 * u * t * cy + t * t * y1]; }
// a hanging chain along a quadratic curve
function chainCurve(g, x0, y0, cx, cy, x1, y1) {
  const n = Math.max(4, Math.round(Math.hypot(x1 - x0, y1 - y0) * 1.3));
  for (let i = 0; i <= n; i++) { const [x, y] = bez(x0, y0, cx, cy, x1, y1, i / n), rx = Math.round(x), ry = Math.round(y); g.fillStyle = OUTL; g.fillRect(rx - 1, ry, 3, 2); g.fillStyle = (i % 3 === 0) ? "#c8d0e0" : "#7a8296"; g.fillRect(rx, ry, 1, 1); }
}
function spikeBall(g, cx, cy, r) {
  g.fillStyle = OUTL; for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; g.fillRect(Math.round(cx + Math.cos(a) * (r + 2)) - 1, Math.round(cy + Math.sin(a) * (r + 2)) - 1, 3, 3); }
  g.fillStyle = "#dfe4f4"; for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; g.fillRect(Math.round(cx + Math.cos(a) * (r + 1.5)), Math.round(cy + Math.sin(a) * (r + 1.5)), 1, 1); }
  inkPart(g, Sh.ell(cx, cy, r, r), tri("#7a8094"));
}
const spriteCache = new Map();
function blitSprite(g, key, flash, x, y, px, py, w, h, fn) {
  key += flash ? "F" : ""; let c = spriteCache.get(key);
  if (!c) { c = mk(w, h); inkFlash = flash; fn(c.getContext("2d"), px, py); inkFlash = false; spriteCache.set(key, c); }
  g.drawImage(c, x - px, y - py);

  if (h.hp <= 0) { G.mode = "dead"; G.dead = 120; }
}
function dust(x, y) { for (let i = 0; i < 6; i++) G.particles.push({ x: x + (Math.random() - .5) * 10, y, vx: (i < 3 ? -1 : 1) * (0.3 + Math.random() * 0.8), vy: -Math.random() * 0.6, t: 12 + Math.random() * 6, color: "#b8b0a0" }); }
const popup = (x, y, text) => G.popups.push({ x, y, text, t: 45 });
function burst(x, y, color) { for (let i = 0; i < 12; i++) G.particles.push({ x, y, vx: (Math.random() - .5) * 3, vy: -Math.random() * 3, t: 30 + Math.random() * 15, color }); }

/* ======================================================================
   11. CAMERA — stays inside the current room
   ====================================================================== */
function camTarget() { const r = G.room, h = G.hero; return { x: Math.max(r.tx * TS, Math.min((r.tx + r.tw) * TS - 256, h.x + 16 - 128)), y: Math.max(r.ty * TS, Math.min((r.ty + r.th) * TS - 224, h.y + 16 - 120)) }; }
function snapCamera() { const t = camTarget(); G.cam.x = t.x; G.cam.y = t.y; }
function updateCamera() { const t = camTarget(); G.cam.x += (t.x - G.cam.x) * 0.25; G.cam.y += (t.y - G.cam.y) * 0.18; if (Math.abs(t.x - G.cam.x) < 0.5) G.cam.x = t.x; if (Math.abs(t.y - G.cam.y) < 0.5) G.cam.y = t.y; }

/* ======================================================================
   12. MAIN UPDATE
   ====================================================================== */
function update() {
  G.frame++;
  if (pressed.debug) G.debug = !G.debug;
  if (pressed.map) G.mode = G.mode === "map" ? "play" : (G.mode === "play" ? "map" : G.mode);
  if (G.mode === "map") { clearPressed(); return; }
  if (G.mode === "shop") { shopUpdate(); clearPressed(); return; }
  if (G.mode === "dead") {
    if (--G.dead <= 0) { const h = G.hero; Object.assign(h, { x: G.shrine.x, y: G.shrine.y, vx: 0, vy: 0, hp: maxHP(), inv: 90, climb: false, atk: 0 }); G.mode = "play"; G.room = null; enterRoom(roomAtPx(h.x + 16, h.y + 16), true); }
    clearPressed(); return;
  }
  if (G.pause > 0) { G.pause--; clearPressed(); return; }
  if (G.shake) G.shake--;
  updateHero(); tryLock();
  if (pressed.up && !G.hero.climb && nearShop()) { openShop(); clearPressed(); return; }
  const r = roomAtPx(G.hero.x + 16, G.hero.y + 20); if (r && r !== G.room) enterRoom(r, false);
  updateItems(); updateEnemies();
  G.popups = G.popups.filter(p => (p.y -= 0.5, --p.t > 0));
  G.particles = G.particles.filter(p => (p.x += p.vx, p.y += p.vy, p.vy += 0.15, --p.t > 0));
  if (G.bannerT) G.bannerT--;
  if (G.frame % CFG.saveEvery === 0) save();
  updateCamera(); clearPressed();
}

/* ======================================================================
   13. DRAWING
   ====================================================================== */
const scr = $("screen"), ctx = scr.getContext("2d");
function tileKind(x, y) {
  const t = tileAt(x, y);
  if (t === LOCK) return "fill";
  if (t === SOLID) return solid(x, y - 1) ? "fill" : "surf";
  if (t === LEDGE) return "ledge";
  if (t === CHAIN) return "chain";
  if (t === LEDGECHAIN) return "ledgechain";
  return tileAt(x, y - 1) === SOLID ? "under" : "wall";
}
function heroFrame() {
  const h = G.hero;
  if (h.climb) return (Math.floor(h.climbDist / 8) % 2) ? "climb1" : "climb0";
  if (h.atk > 0) { const s = h.atk >= CFG.strikeFrom && h.atk <= CFG.strikeTo; return h.crouch ? (s ? "cstrike" : "cwind") : (s ? "strike" : "windup"); }
  if (h.crouch) return "crouch";
  if (!h.ground) return h.vy < 0 ? "jump" : "fall";
  if (h.vx !== 0) return "walk" + (Math.floor(h.anim / 3.5) % 8);
  return "stand";
}
function draw() {
  ctx.imageSmoothingEnabled = false;
  if (G.mode === "map") return drawMap();
  const sh = G.shake ? Math.min(2, Math.ceil(G.shake / 3)) : 0, cx = Math.round(G.cam.x) + (sh ? Math.round((Math.random() - .5) * 2 * sh) : 0), cy = Math.round(G.cam.y) + (sh ? Math.round((Math.random() - .5) * 2 * sh) : 0), x0 = Math.floor(cx / TS), y0 = Math.floor(cy / TS);
  for (let y = y0; y <= y0 + 14; y++) for (let x = x0; x <= x0 + 16; x++) {
    const zc = Math.floor(y / CH), zone = zoneOfCellY(Math.max(0, Math.min(GH - 1, zc)));
    ctx.drawImage(Art.tile(zone, tileKind(x, y), x, y), x * TS - cx, y * TS - cy);
    if (tileAt(x, y) === LOCK) ctx.drawImage(extraArt("lock"), x * TS - cx, y * TS - cy);
  }
  for (const it of world.items) {
    if (it.gone || it.x < cx - 16 || it.x > cx + 256 || it.y < cy - 16 || it.y > cy + 224) continue;
    const bob = it.kind === "coin" && !it.falling ? Math.round(Math.sin((G.frame + it.x) / 12) * 1.5) : 0;
    const art = it.kind === "shrine" ? ((G.frame >> 3) & 1 ? "shrineA" : "shrineB") : it.art;
    ctx.drawImage(EXTRA_ART.has(art) ? extraArt(art) : Art.item(art), Math.round(it.x) - cx, Math.round(it.y) - cy + bob);
  }
  for (const e of G.enemies) if (e.alive) ENEMY_ART[e.type](ctx, e, Math.round(e.x) - cx, Math.round(e.y) - cy, G.frame, e.hurt > 0 && (e.hurt & 2));
  for (const sh of G.shots) { ctx.save(); ctx.translate(Math.round(sh.x) - cx, Math.round(sh.y) - cy); ctx.rotate(sh.t / 3); ctx.fillStyle = "#e0dcc8"; ctx.fillRect(-4, -1, 8, 2); ctx.fillRect(-5, -2, 2, 4); ctx.fillRect(3, -2, 2, 4); ctx.restore(); }
  const h = G.hero;
  if (G.mode !== "dead") {                      // a soft warm light around the hero so he stands out from dark rock
    const gx = Math.round(h.x + 16 - cx), gy = Math.round(h.y + 8 - cy), gr = ctx.createRadialGradient(gx, gy, 3, gx, gy, 50);
    gr.addColorStop(0, "rgba(255,214,150,.22)"); gr.addColorStop(1, "rgba(255,214,150,0)");
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = gr; ctx.fillRect(gx - 50, gy - 50, 100, 100); ctx.restore();
  }
  if (G.mode !== "dead" && !(h.inv && (G.frame & 4))) {
    const fn = heroFrame(), f = Art.hero(fn, h.dir);
    const bob = (fn === "walk2" || fn === "walk6") ? 1 : 0;                     // weight: the body dips as each foot lands
    const land = h.landT > 0 ? Math.min(2, Math.ceil(h.landT / 2)) : 0;         // brief squash after a hard landing
    const lunge = (h.atk >= CFG.strikeFrom && h.atk <= CFG.strikeTo) ? 2 * (h.dir < 0 ? -1 : 1) : 0;
    ctx.drawImage(f.img, Math.round(h.x) - f.ox - cx + lunge, Math.round(h.y) - cy + bob + land - (f.oy || 0));
  }
  for (const p of G.particles) { ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x) - cx, Math.round(p.y) - cy, 2, 2); }
  ctx.font = "bold 8px monospace"; ctx.textAlign = "center";
  for (const p of G.popups) { ctx.fillStyle = "#000"; ctx.fillText(p.text, p.x - cx + 1, p.y - cy + 1); ctx.fillStyle = "#ffe680"; ctx.fillText(p.text, p.x - cx, p.y - cy); }
  const ns = G.mode === "play" ? nearShop() : null;
  if (ns) { ctx.font = "bold 8px monospace"; ctx.textAlign = "center"; ctx.fillStyle = "#000"; ctx.fillText("UP: SHOP", ns.x + 9 - cx, ns.y - 3 - cy); ctx.fillStyle = "#ffe680"; ctx.fillText("UP: SHOP", ns.x + 8 - cx, ns.y - 4 - cy); }
  drawHUD();
  ctx.font = "7px monospace"; ctx.textAlign = "left"; ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.fillText("v" + VERSION, 4, 221);
  if (G.mode === "shop") drawShop();
  if (G.debug) drawDebug();
}
function drawHUD() {
  const h = G.hero;
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(3, 3, Math.max(92, 10 + maxHP() * 9), 34);
  ctx.font = "bold 8px monospace"; ctx.textAlign = "left"; ctx.fillStyle = "#cfd6e8"; ctx.fillText("KEY " + G.keyCount + "  ARM " + G.armour + "  FLAIL " + G.flail + (G.abilities.has("boots") ? "  JUMP+" : ""), 6, 34);
  ctx.drawImage(Art.item("hudCoin"), 4, 3); ctx.textAlign = "left"; ctx.font = "bold 9px monospace"; ctx.fillStyle = "#ffe680"; ctx.fillText("ZENNY " + G.zenny, 21, 14);
  for (let i = 0; i < maxHP(); i++) { ctx.fillStyle = i < h.hp ? "#e04050" : "#40303a"; ctx.fillRect(6 + i * 9, 18, 7, 6); }
  // minimap: 5 x 3 cells around the hero
  const hcx = Math.floor((h.x + 16) / (CW * TS)), hcy = Math.floor((h.y + 16) / (CH * TS)), mx = 256 - 5 * 8 - 4, my = 4;
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(mx - 1, my - 1, 5 * 8 + 2, 3 * 6 + 2);
  for (let j = -1; j <= 1; j++) for (let i = -2; i <= 2; i++) {
    const x = hcx + i, y = hcy + j; if (x < 0 || y < 0 || x >= GW || y >= GH || !G.visited.has(y * GW + x)) continue;
    ctx.fillStyle = (i === 0 && j === 0 && (G.frame & 16)) ? "#fff" : ZONES[zoneOfCellY(y)].ledge; ctx.fillRect(mx + (i + 2) * 8, my + (j + 1) * 6, 7, 5);
  }
  if (G.bannerT) { const a = Math.min(1, G.bannerT / 30); ctx.globalAlpha = a; ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.fillRect(0, 92, 256, 24); ctx.fillStyle = "#ffe680"; ctx.textAlign = "center"; ctx.font = "bold 11px monospace"; ctx.fillText(G.banner, 128, 108); ctx.globalAlpha = 1; }
  if (G.mode === "dead") { ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fillRect(0, 96, 256, 28); ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "bold 11px monospace"; ctx.fillText("Back to the last shrine…", 128, 114); }
}
function drawShop() {
  const rows = shopRows(), x = 40, y = 52, w = 176, hgt = 22 + rows.length * 16 + 22;
  ctx.fillStyle = "rgba(0,0,0,.82)"; ctx.fillRect(x, y, w, hgt); ctx.strokeStyle = "#d4a843"; ctx.strokeRect(x + .5, y + .5, w - 1, hgt - 1);
  ctx.textAlign = "left"; ctx.font = "bold 9px monospace"; ctx.fillStyle = "#ffe680"; ctx.fillText("WISE MAN", x + 8, y + 13); ctx.textAlign = "right"; ctx.fillText("ZENNY " + G.zenny, x + w - 8, y + 13);
  ctx.font = "9px monospace";
  rows.forEach((r, i) => {
    const yy = y + 22 + i * 16, sel = i === G.shopSel;
    if (sel) { ctx.fillStyle = "rgba(212,168,67,.3)"; ctx.fillRect(x + 4, yy - 1, w - 8, 14); }
    ctx.textAlign = "left"; ctx.fillStyle = G.zenny >= r.price ? "#fff" : "#8a8a96"; ctx.fillText((sel ? "> " : "  ") + r.label, x + 8, yy + 9);
    ctx.textAlign = "right"; ctx.fillText(String(r.price), x + w - 8, yy + 9);
  });
  ctx.textAlign = "center"; ctx.font = "8px monospace"; ctx.fillStyle = G.shopMsgT ? "#ffb070" : "#aab";
  ctx.fillText(G.shopMsgT ? G.shopMsg : "Up/Down choose   Jump buy   Flail close", x + w / 2, y + hgt - 7);
}
function drawMap() {
  ctx.fillStyle = "#0b0c12"; ctx.fillRect(0, 0, 256, 224);
  const s = 6, sy = 5, ox = (256 - GW * s) / 2, oy = 34, h = G.hero;
  ctx.fillStyle = "#ffe680"; ctx.textAlign = "center"; ctx.font = "bold 10px monospace"; ctx.fillText("MAP", 128, 14);
  ctx.font = "8px monospace"; ctx.fillStyle = "#aab"; ctx.fillText(G.room ? ZONES[G.room.zone].name : "", 128, 26);
  for (const r of world.rooms) {
    let seen = false; for (let j = 0; j < r.h; j++) for (let i = 0; i < r.w; i++) if (G.visited.has((r.y + j) * GW + r.x + i)) seen = true;
    if (!seen && !G.debug) continue;
    ctx.fillStyle = seen ? ZONES[r.zone].ledge : "#333"; ctx.fillRect(ox + r.x * s + 1, oy + r.y * sy + 1, r.w * s - 1, r.h * sy - 1);
  }
  const hcx = (h.x + 16) / (CW * TS), hcy = (h.y + 16) / (CH * TS);
  if (G.frame & 16) { ctx.fillStyle = "#fff"; ctx.fillRect(ox + hcx * s - 1, oy + hcy * sy - 1, 3, 3); }
  ctx.fillStyle = "#aab"; ctx.fillText("Press M to close", 128, 216);
}
function drawDebug() {
  const h = G.hero, r = G.room;
  ctx.textAlign = "left"; ctx.font = "8px monospace"; ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 196, 256, 28); ctx.fillStyle = "#8f8";
  ctx.fillText(`room ${r.id} ${r.w}x${r.h} zone ${r.zone} cell ${Math.floor((h.x + 16) / 256)},${Math.floor((h.y + 16) / 224)}`, 3, 206);
  ctx.fillText(`x ${h.x.toFixed(1)} y ${h.y.toFixed(1)} vy ${h.vy.toFixed(2)} ground ${h.ground} climb ${h.climb}`, 3, 216);
}
function fit() { const tc = document.body.classList.contains("touch"), s = Math.max(1, tc ? Math.min(innerWidth / 256, (innerHeight - 4) / 224) : Math.floor(Math.min((innerWidth - 24) / 256, (innerHeight - 190) / 224))); scr.style.width = 256 * s + "px"; scr.style.height = 224 * s + "px"; }
addEventListener("resize", fit);

/* ======================================================================
   14. START-UP
   ====================================================================== */
let running = false, last = 0, acc = 0;
function loop(t) { pollPad(); acc += Math.min(100, t - last); last = t; while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; } draw(); requestAnimationFrame(loop); }
function begin() {
  const urlSeed = +new URLSearchParams(location.search).get("seed"), saved = loadSave();
  if (urlSeed) newGame(urlSeed, saved && saved.seed === urlSeed ? saved : null);
  else if (saved) newGame(saved.seed, saved);
  else newGame((Math.random() * 1e9) | 0, null);
  $("stage").hidden = false;
  fit(); scr.focus();
  if (!running) { running = true; last = performance.now(); requestAnimationFrame(loop); }
}
let newArmed = 0;
$("newWorld").onclick = () => {
  if (!newArmed) { newArmed = 1; $("newWorld").textContent = "Tap again to erase progress"; setTimeout(() => { newArmed = 0; $("newWorld").textContent = "New world"; }, 3000); return; }
  newArmed = 0; $("newWorld").textContent = "New world"; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} newGame((Math.random() * 1e9) | 0, null); scr.focus();
};
Art.mode = "placeholder"; begin();
</script>
